name: Build and deploy package site

# One-time setup: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs DESCRIPTION deps, then R CMD build + INSTALL the package (".")
      # so vignettes land in doc/.
      - uses: yihui/actions/setup-r-dependencies@main
        with:
          extra-packages: litedown xfun roxygen2 .
          r-universe: yihui

      # No man/ is committed; generate Rd files, then reinstall so the installed
      # package (which the manual page reads) includes the help pages.
      - name: Generate Rd documentation
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          R CMD INSTALL .

      - uses: yihui/actions/litedown-site@main
        with:
          site-dir: 'site'

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
